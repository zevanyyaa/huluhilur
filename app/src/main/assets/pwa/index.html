<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1B3B2B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Hulu Guard - Aplikasi pendeteksi sampah kemasan pendaki berbasis YOLO11 ONNX Runtime Web." />
  <title>Hulu Guard — Jaga Alam, Jaga Langkah</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <!-- Tailwind CSS Play CDN (cached by Service Worker for offline mountain use) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.tailwind) {
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              forest: '#1B3B2B',
              sage: '#C5E898',
              softsage: '#EDF4E8',
              offwhite: '#F8FAF7',
              ink: '#16261E',
              muted: '#5C6B63'
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif']
            }
          }
        }
      };
    }
  </script>

  <!-- ONNX Runtime Web for client-side YOLO11 inference -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>

  <link rel="stylesheet" href="./styles/app.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Single Page App root mounted by js/app.js -->
    <div class="flex-1 flex flex-col items-center justify-center p-8 text-center">
      <div class="w-12 h-12 rounded-2xl bg-[#1B3B2B] flex items-center justify-center mb-4">
        <span class="text-[#C5E898] font-bold text-lg">HG</span>
      </div>
      <p class="text-sm font-semibold text-[#16261E]">Memuat Hulu Guard...</p>
      <p class="text-xs text-[#5C6B63] mt-1">JAGA ALAM, JAGA LANGKAH.</p>
    </div>
  </div>

  <!-- Toast / Snackbar Portal -->
  <div id="toast-root" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-[390px] pointer-events-none flex flex-col gap-2"></div>

  <!-- Modal Portal -->
  <div id="modal-root" class="fixed inset-0 z-50 hidden"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
